<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm border-0 mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">

            <h1 class="h4 mb-4"
                th:text="${cliente.idCliente > 0 ? 'Editar cliente' : 'Nuevo cliente'}">
            </h1>

            <div class="alert alert-danger"
                 th:if="${error != null}"
                 th:text="${error}">
            </div>

            <form method="post"
                  th:action="@{/clientes/guardar}"
                  th:object="${cliente}">

                <input type="hidden" th:field="*{idCliente}">

                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input class="form-control"
                           th:field="*{codigo}"
                           readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input class="form-control"
                           th:field="*{nombre}"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Teléfono</label>
                    <input class="form-control"
                           th:field="*{telefono}">
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/clientes}">Cancelar</a>
                </div>

            </form>
        </div>
    </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial del cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <h1 class="h3">
        Historial de <span th:text="${cliente.nombre}"></span>
    </h1>

    <p>
        Código:
        <strong th:text="${cliente.codigo}"></strong>
        |
        Saldo actual:
        <strong th:text="${cliente.saldoPuntos + ' puntos'}"></strong>
    </p>

    <a th:href="@{/clientes}" class="btn btn-secondary mb-4">Volver</a>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h2 class="h5">Pedidos</h2>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Pedido</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td>
                            <a th:href="@{/pedidos/{id}(id=${pedido.idPedido})}"
                               th:text="${'#' + pedido.idPedido}">
                            </a>
                        </td>
                        <td th:text="${pedido.fecha}"></td>
                        <td th:text="${pedido.estado}"></td>
                        <td th:text="${'Q' + pedido.total}"></td>
                    </tr>

                    <tr th:if="${pedidos == null or pedidos.empty}">
                        <td colspan="4" class="text-center text-muted">
                            No hay pedidos registrados para este cliente.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h2 class="h5">Movimientos de puntos</h2>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Puntos</th>
                        <th>Saldo</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="movimiento : ${movimientos}">
                        <td th:text="${movimiento.fecha}"></td>
                        <td th:text="${movimiento.tipo}"></td>
                        <td th:text="${movimiento.puntos}"></td>
                        <td th:text="${movimiento.saldoResultante}"></td>
                    </tr>

                    <tr th:if="${movimientos == null or movimientos.empty}">
                        <td colspan="4" class="text-center text-muted">
                            No hay movimientos de puntos.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="h5">Canjes</h2>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Recompensa</th>
                        <th>Puntos utilizados</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="canje : ${canjes}">
                        <td th:text="${canje.fecha}"></td>
                        <td th:text="${canje.recompensa.nombre}"></td>
                        <td th:text="${canje.puntosUtilizados}"></td>
                    </tr>

                    <tr th:if="${canjes == null or canjes.empty}">
                        <td colspan="3" class="text-center text-muted">
                            No hay canjes registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>

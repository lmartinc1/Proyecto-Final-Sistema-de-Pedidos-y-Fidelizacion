<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3">Clientes</h1>
            <a th:href="@{/dashboard}">Volver al panel</a>
        </div>
        <a class="btn btn-primary" th:href="@{/clientes/nuevo}">Nuevo cliente</a>
    </div>

    <div class="alert alert-danger"
         th:if="${error != null}"
         th:text="${error}">
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Puntos</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.codigo}"></td>
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.telefono}"></td>
                        <td th:text="${cliente.saldoPuntos}"></td>
                        <td th:text="${cliente.activo ? 'Activo' : 'Inactivo'}"></td>
                        <td class="d-flex gap-2 flex-wrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}">
                                Editar
                            </a>

                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/clientes/historial/{id}(id=${cliente.idCliente})}">
                                Historial
                            </a>

                            <form method="post"
                                  th:if="${cliente.activo}"
                                  th:action="@{/clientes/desactivar/{id}(id=${cliente.idCliente})}">
                                <button class="btn btn-sm btn-outline-danger" type="submit">
                                    Desactivar
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${clientes == null or clientes.empty}">
                        <td colspan="6" class="text-center text-muted">
                            No hay clientes registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fidelización</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <h1 class="h3">Fidelización</h1>
    <a th:href="@{/dashboard}">Volver al panel</a>

    <div class="alert alert-success mt-3"
         th:if="${ok}">
        Canje realizado correctamente.
    </div>

    <div class="alert alert-danger mt-3"
         th:if="${error != null}"
         th:text="${error}">
    </div>

    <div class="card border-0 shadow-sm my-4">
        <div class="card-body">

            <h2 class="h5">Realizar canje</h2>

            <form method="post" th:action="@{/fidelizacion/canjear}">

                <div class="mb-3">
                    <label class="form-label">Cliente</label>

                    <select class="form-select"
                            name="codigoCliente"
                            required>
                        <option th:each="cliente : ${clientes}"
                                th:value="${cliente.codigo}"
                                th:text="${cliente.codigo + ' - ' + cliente.nombre + ' (' + cliente.saldoPuntos + ' puntos)'}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Recompensa</label>

                    <select class="form-select"
                            name="codigoRecompensa"
                            required>
                        <option th:each="recompensa : ${recompensas}"
                                th:value="${recompensa.codigo}"
                                th:text="${recompensa.nombre + ' - ' + recompensa.puntosRequeridos + ' puntos'}">
                        </option>
                    </select>
                </div>

                <button class="btn btn-primary" type="submit">
                    Canjear
                </button>

            </form>

        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <h2 class="h5">Consultar historial</h2>

            <a class="btn btn-outline-secondary btn-sm mb-2 me-1"
               th:each="cliente : ${clientes}"
               th:href="@{/fidelizacion/historial/{codigo}(codigo=${cliente.codigo})}"
               th:text="${cliente.codigo + ' - ' + cliente.nombre}">
            </a>

        </div>
    </div>

</div>
</body>
</html>

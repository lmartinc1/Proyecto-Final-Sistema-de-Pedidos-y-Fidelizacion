<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de fidelización</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <h1 class="h3">
        Fidelización de <span th:text="${cliente.nombre}"></span>
    </h1>

    <p>
        Saldo:
        <strong th:text="${cliente.saldoPuntos + ' puntos'}"></strong>
    </p>

    <a class="btn btn-secondary mb-4" th:href="@{/fidelizacion}">
        Volver
    </a>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">

            <h2 class="h5">Movimientos</h2>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Puntos</th>
                        <th>Saldo resultante</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="movimiento : ${movimientos}">
                        <td th:text="${movimiento.fecha}"></td>
                        <td th:text="${movimiento.tipo}"></td>
                        <td th:text="${movimiento.puntos}"></td>
                        <td th:text="${movimiento.saldoResultante}"></td>
                    </tr>

                    <tr th:if="${movimientos == null or movimientos.empty}">
                        <td colspan="4" class="text-center text-muted">
                            No hay movimientos.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <h2 class="h5">Canjes</h2>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Recompensa</th>
                        <th>Puntos</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="canje : ${canjes}">
                        <td th:text="${canje.fecha}"></td>
                        <td th:text="${canje.recompensa.nombre}"></td>
                        <td th:text="${canje.puntosUtilizados}"></td>
                    </tr>

                    <tr th:if="${canjes == null or canjes.empty}">
                        <td colspan="3" class="text-center text-muted">
                            No hay canjes.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</body>
</html>

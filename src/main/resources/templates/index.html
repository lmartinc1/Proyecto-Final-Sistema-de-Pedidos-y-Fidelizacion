<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pan, Puntos y Premios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow border-0 login-card">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h1 class="h3 fw-bold">Pan, Puntos y Premios</h1>
                <p class="text-muted mb-0">Sistema de Pedidos y Fidelización</p>
            </div>

            <div class="alert alert-danger"
                 th:if="${error != null}"
                 th:text="${error}">
            </div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label class="form-label">Teléfono o correo</label>
                    <input type="text"
                           class="form-control"
                           name="usuario"
                           placeholder="Ingrese teléfono o correo">
                </div>

                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password"
                           class="form-control"
                           name="password"
                           placeholder="Ingrese contraseña">
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Ingresar
                </button>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

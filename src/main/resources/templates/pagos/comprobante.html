<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comprobante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm border-0 mx-auto" style="max-width: 650px;">
        <div class="card-body">

            <h1 class="h4 text-success">Pago aprobado</h1>
            <hr>

            <p>
                Pedido:
                <strong th:text="${'#' + pago.pedido.idPedido}"></strong>
            </p>

            <p>
                Cliente:
                <strong th:text="${pago.pedido.cliente.nombre}"></strong>
            </p>

            <p>
                Total:
                <strong th:text="${'Q' + pago.monto}"></strong>
            </p>

            <div th:if="${esEfectivo}">
                <p>
                    Recibido:
                    <span th:text="${'Q' + pagoEfectivo.montoRecibido}"></span>
                </p>

                <p>
                    Cambio:
                    <span th:text="${'Q' + pagoEfectivo.cambio}"></span>
                </p>
            </div>

            <p th:unless="${esEfectivo}">
                Referencia:
                <span th:text="${pago.referencia}"></span>
            </p>

            <p>
                Puntos actuales:
                <strong th:text="${pago.pedido.cliente.saldoPuntos}"></strong>
            </p>

            <a class="btn btn-primary" th:href="@{/pedidos}">
                Volver a pedidos
            </a>

        </div>
    </div>

</div>
</body>
</html>

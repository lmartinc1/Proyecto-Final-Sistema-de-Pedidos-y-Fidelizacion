<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <div th:if="${pedido != null}">

        <h1 class="h3"
            th:text="${'Pedido #' + pedido.idPedido}">
        </h1>

        <p>
            Cliente:
            <strong th:text="${pedido.cliente.nombre}"></strong>
        </p>

        <p>
            Estado:
            <strong th:text="${pedido.estado}"></strong>
        </p>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Artículo</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="detalle : ${pedido.detalles}">
                            <td th:text="${detalle.tipoItem}"></td>
                            <td th:text="${detalle.tipoItem == 'PRODUCTO' ? detalle.producto.nombre : detalle.menu.nombre}"></td>
                            <td th:text="${detalle.cantidad}"></td>
                            <td th:text="${'Q' + detalle.precioUnitario}"></td>
                            <td th:text="${'Q' + detalle.subtotal}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <h2 class="h4 text-end"
                    th:text="${'Total: Q' + pedido.total}">
                </h2>

            </div>
        </div>

        <a class="btn btn-success"
           th:if="${pedido.estado == 'PENDIENTE'}"
           th:href="@{/pagos/{id}(id=${pedido.idPedido})}">
            Cobrar pedido
        </a>

    </div>

    <a class="btn btn-secondary" th:href="@{/pedidos}">Volver</a>

</div>
</body>
</html>

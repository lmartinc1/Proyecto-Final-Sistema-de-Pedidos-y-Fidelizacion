<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between mb-4">
        <div>
            <h1 class="h3">Pedidos</h1>
            <a th:href="@{/dashboard}">Volver al panel</a>
        </div>
        <a class="btn btn-primary" th:href="@{/pedidos/nuevo}">Nuevo pedido</a>
    </div>

    <div class="alert alert-danger"
         th:if="${error != null}"
         th:text="${error}">
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${'#' + pedido.idPedido}"></td>
                        <td th:text="${pedido.fecha}"></td>
                        <td th:text="${pedido.cliente.nombre}"></td>
                        <td th:text="${'Q' + pedido.total}"></td>
                        <td th:text="${pedido.estado}"></td>

                        <td class="d-flex gap-2 flex-wrap">

                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/pedidos/{id}(id=${pedido.idPedido})}">
                                Ver
                            </a>

                            <a class="btn btn-sm btn-success"
                               th:if="${pedido.estado == 'PENDIENTE'}"
                               th:href="@{/pagos/{id}(id=${pedido.idPedido})}">
                                Cobrar
                            </a>

                            <form method="post"
                                  th:if="${pedido.estado == 'PENDIENTE'}"
                                  th:action="@{/pedidos/anular/{id}(id=${pedido.idPedido})}">
                                <button class="btn btn-sm btn-outline-danger" type="submit">
                                    Anular
                                </button>
                            </form>

                            <form method="post"
                                  th:if="${pedido.estado == 'PAGADO'}"
                                  th:action="@{/pedidos/entregar/{id}(id=${pedido.idPedido})}">
                                <button class="btn btn-sm btn-success" type="submit">
                                    Marcar entregado
                                </button>
                            </form>

                        </td>
                    </tr>

                    <tr th:if="${pedidos == null or pedidos.empty}">
                        <td colspan="6" class="text-center text-muted">
                            No hay pedidos registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>

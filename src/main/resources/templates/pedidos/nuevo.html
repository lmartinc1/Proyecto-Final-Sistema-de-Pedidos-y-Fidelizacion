<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <h1 class="h3 mb-4">Nuevo pedido</h1>

    <div class="alert alert-danger"
         th:if="${error != null}"
         th:text="${error}">
    </div>

    <form method="post" th:action="@{/pedidos/crear}">

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">

                <label class="form-label">Cliente</label>

                <select class="form-select"
                        name="codigoCliente"
                        required>
                    <option th:each="cliente : ${clientes}"
                            th:value="${cliente.codigo}"
                            th:text="${cliente.codigo + ' - ' + cliente.nombre}">
                    </option>
                </select>

            </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">

                <h2 class="h5">Productos</h2>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Disponible</th>
                            <th style="width: 140px;">Cantidad</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="producto : ${productos}">
                            <td th:text="${producto.codigo + ' - ' + producto.nombre}"></td>
                            <td th:text="${'Q' + producto.precio}"></td>
                            <td th:text="${producto.existencia}"></td>
                            <td>
                                <input type="number"
                                       min="0"
                                       value="0"
                                       class="form-control"
                                       th:name="${'producto_' + producto.idProducto}">
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">

                <h2 class="h5">Menús completos</h2>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Menú</th>
                            <th>Componentes</th>
                            <th>Precio</th>
                            <th style="width: 140px;">Cantidad</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="menu : ${menus}">
                            <td th:text="${menu.codigo + ' - ' + menu.nombre}"></td>
                            <td th:text="${menu.sandwich.nombre + ', ' + menu.bebida.nombre + ', ' + menu.acompanamiento.nombre}"></td>
                            <td th:text="${'Q' + menu.precio}"></td>
                            <td>
                                <input type="number"
                                       min="0"
                                       value="0"
                                       class="form-control"
                                       th:name="${'menu_' + menu.idMenu}">
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

        <button class="btn btn-primary" type="submit">Crear pedido</button>
        <a class="btn btn-secondary" th:href="@{/pedidos}">Cancelar</a>

    </form>

</div>
</body>
</html>

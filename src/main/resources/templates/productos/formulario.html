<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm border-0 mx-auto" style="max-width: 650px;">
        <div class="card-body">

            <h1 class="h4 mb-4"
                th:text="${producto.idProducto > 0 ? 'Editar producto' : 'Nuevo producto'}">
            </h1>

            <div class="alert alert-danger"
                 th:if="${error != null}"
                 th:text="${error}">
            </div>

            <form method="post"
                  th:action="@{/productos/guardar}"
                  th:object="${producto}">

                <input type="hidden" th:field="*{idProducto}">

                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input class="form-control"
                           th:field="*{codigo}"
                           th:readonly="${producto.idProducto > 0}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select class="form-select" th:field="*{categoria}">
                        <option value="SANDWICH">Sándwich</option>
                        <option value="BEBIDA">Bebida</option>
                        <option value="ACOMPANAMIENTO">Acompañamiento</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input class="form-control"
                           th:field="*{nombre}"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Precio</label>
                    <input class="form-control"
                           type="number"
                           step="0.01"
                           min="0"
                           th:field="*{precio}"
                           required>
                </div>

                <p class="text-muted">
                    La existencia se modifica desde el módulo Inventario.
                </p>

                <button class="btn btn-primary" type="submit">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/productos}">Cancelar</a>
            </form>

        </div>
    </div>

</div>
</body>
</html>

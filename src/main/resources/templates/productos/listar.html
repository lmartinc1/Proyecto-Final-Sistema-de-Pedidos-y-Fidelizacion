<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between mb-4">
        <div>
            <h1 class="h3">Productos</h1>
            <a th:href="@{/dashboard}">Volver al panel</a>
        </div>
        <a class="btn btn-primary" th:href="@{/productos/nuevo}">Nuevo producto</a>
    </div>

    <div class="alert alert-danger"
         th:if="${error != null}"
         th:text="${error}">
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Categoría</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Existencia</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.codigo}"></td>
                        <td th:text="${producto.categoria}"></td>
                        <td th:text="${producto.nombre}"></td>
                        <td th:text="${'Q' + producto.precio}"></td>
                        <td th:text="${producto.existencia}"></td>
                        <td th:text="${producto.activo ? 'Activo' : 'Inactivo'}"></td>

                        <td class="d-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/productos/editar/{id}(id=${producto.idProducto})}">
                                Editar
                            </a>

                            <form method="post"
                                  th:if="${producto.activo}"
                                  th:action="@{/productos/desactivar/{id}(id=${producto.idProducto})}">
                                <button class="btn btn-sm btn-outline-danger" type="submit">
                                    Desactivar
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${productos == null or productos.empty}">
                        <td colspan="7" class="text-center text-muted">
                            No hay productos registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
